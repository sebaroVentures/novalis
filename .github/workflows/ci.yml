name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Advisory databases move without us. Without a clock trigger, `cargo audit`
  # and `pnpm audit` only ever see a new RUSTSEC/GHSA entry when someone
  # happens to push — RUSTSEC-2026-0235 landed ten days after the last run.
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  # release.yml calls this workflow as its gate, so a tag push runs exactly the
  # same checks as a PR instead of a second, drifting copy (see RELEASING.md).
  workflow_call:
  # Manual trigger. Not decoration: during the 2026-08-06 Actions incident a
  # push to main produced no run at all, and with only the triggers above there
  # was no way to ask for one — the commit sat unverified until the next push.
  # `gh workflow run ci.yml --ref main` covers that, and re-running a flake.
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default; no job here needs to write to the repo. Explicit
# because a fork PR runs the fork's copy of this file with our runners.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # `persist-credentials: false` keeps the job's token out of .git/config
      # while ~925 crates' build.rs and esbuild's postinstall run as this user.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # Tauri's Linux build needs the WebKitGTK stack (see plan: Linux WebKitGTK risk);
      # libasound2-dev provides the ALSA headers cpal (native voice capture) links against.
      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libasound2-dev \
            patchelf \
            build-essential

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      # dtolnay/rust-toolchain can't read rust-toolchain.toml (its `toolchain`
      # input is required), so the pin is duplicated here — keep it in sync
      # with rust-toolchain.toml when bumping.
      #
      # The SHA is master's head, not a tag: this action's only tag (`v1`) is a
      # year stale and predates RUSTUP_PERMIT_COPY_RENAME=1 on the install step,
      # which the Windows leg needs. Dependabot cannot map a branch SHA to a
      # version, so this pin is maintained by hand — re-resolve with
      # `gh api repos/dtolnay/rust-toolchain/commits/master --jq .sha`.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master @ 2026-08-05
        with:
          toolchain: "1.93.0"
          components: rustfmt, clippy

      - name: Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "."

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # Build the frontend first so `dist/` exists before the Rust app compiles
      # (tauri::generate_context! embeds it). Uses the committed IPC bindings.
      - name: Build frontend
        run: pnpm --filter @novalis/frontend build

      # Frontend JS checks are OS-independent — run once (Linux) to save CI time.
      - name: Frontend lint (no hardcoded UI strings)
        if: matrix.os == 'ubuntu-latest'
        run: pnpm --filter @novalis/frontend lint

      - name: Frontend i18n catalogs up to date
        if: matrix.os == 'ubuntu-latest'
        run: pnpm --filter @novalis/frontend i18n:check

      # Recursive so every workspace package with a `test` script runs
      # (frontend + editor today); a new package's tests are picked up
      # without editing CI.
      - name: JS tests
        if: matrix.os == 'ubuntu-latest'
        run: pnpm -r test

      # `--if-present` so packages gain typechecking simply by adding a
      # `typecheck` script — harmless for packages that don't have one.
      - name: Typecheck (workspace packages)
        if: matrix.os == 'ubuntu-latest'
        run: pnpm -r --if-present run typecheck

      # The three release version stamps must stay in sync (see RELEASING.md).
      - name: Version stamps in sync
        if: matrix.os == 'ubuntu-latest'
        run: node scripts/check-versions.mjs

      - name: Rust format check
        run: cargo fmt --all --check

      # `--locked` on the three build/test invocations below: without it cargo
      # may silently re-resolve Cargo.lock, so CI would build a dependency set
      # the `audit` job never looked at. It is the Rust half of
      # `--frozen-lockfile`. (`pnpm gen:bindings` further down also shells out
      # to cargo but is left alone — it runs after `cargo test --locked` has
      # already proven the lockfile is in sync, and the flag lives in the root
      # package.json script, where it would break local edits to Cargo.toml.)
      - name: Clippy (deny warnings)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --workspace

      # The P2P sync end-to-end test drives a real two-endpoint QUIC loopback
      # (relays disabled) and is gated behind `p2p-loopback-test` so its
      # network-touching setup never gates the default fmt/clippy/test. Run it
      # explicitly on the Linux leg so CI actually exercises the encrypted
      # multi-endpoint sync + unknown-peer-refusal path (needs libasound2-dev,
      # installed above, for the desktop crate's cpal/ALSA link).
      - name: P2P loopback E2E (gated)
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --locked -p novalis-desktop --features p2p-loopback-test

      # Guard against Rust/TS drift: regenerated bindings must match what's
      # committed. Linux-only: the generated file is OS-independent, and the
      # Windows runner's line-ending handling makes the diff a flake vector.
      - name: Verify IPC bindings are up to date
        if: matrix.os == 'ubuntu-latest'
        run: |
          pnpm gen:bindings
          git diff --exit-code apps/desktop/frontend/src/ipc/bindings.ts

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    # The Rust half is blocking. Accepted advisories live in `.cargo/audit.toml`,
    # each with a written justification and a revisit condition — a new advisory
    # fails CI. (`unmaintained`/`unsound` warnings — gtk3 bindings from Tauri's
    # Linux stack, anyhow, glib, paste, proc-macro-error, instant, unic-* — are
    # warnings, not failures.) Deliberately carries no `if:` guard, so the
    # weekly `schedule` trigger above actually reaches it.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # Node toolchain up front, and `!cancelled()` on the pnpm step below, so
      # one run always reports *both* ecosystems — a failing `cargo audit`
      # otherwise hides however many JS advisories landed the same week.
      # `pnpm audit` reads only the lockfile, so there is no `pnpm install`.
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # A prebuilt cargo-audit release binary, not `cargo install`. The old
      # step compiled the tool from source on every run (~3 min, measured) and
      # needed a *second* stable toolchain because cargo-audit's deps (e.g.
      # kstring) out-MSRV the repo's pinned 1.93 (rust-toolchain.toml). A
      # downloaded binary has no build toolchain at all, so both the compile
      # and that workaround are gone; the version is pinned here so a
      # cargo-audit regression can't turn CI red on its own schedule.
      - name: Install cargo-audit and cargo-deny
        uses: taiki-e/install-action@91ddec75689c4c78665b598d188dc821c5a43e5c # v2.85.9
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2

      - name: Run cargo audit
        run: cargo audit

      # The half `cargo audit` does not cover: what we are allowed to ship, and
      # where crates come from. `licenses` holds the tree to an allow-list that
      # is compatible with shipping under MIT, `sources` refuses anything from
      # outside crates.io, `bans` reports duplicate majors. Checked against all
      # four shipped targets, so a Windows- or Linux-only dependency cannot slip
      # a license past a macOS developer. Config and rationale in `deny.toml`.
      #
      # It reads crate manifests, so it CANNOT see vendored C: libgit2 (GPL-2.0
      # with a linking exception) and OpenSSL are both statically linked and are
      # documented by hand in THIRD-PARTY-NOTICES.md. A green run here does not
      # discharge that.
      - name: Run cargo deny
        if: ${{ !cancelled() }}
        run: cargo deny --locked check licenses bans sources

      # Blocking, like the Rust half. The lockfile was re-resolved from the
      # committed manifests (`rm pnpm-lock.yaml && pnpm install
      # --lockfile-only` in a copy without node_modules — with node_modules
      # present pnpm short-circuits and writes nothing), which took `pnpm
      # audit` from 29 findings / 16 `high` to zero without editing a single
      # package.json and without a major bump: every fix was already inside the
      # declared ranges.
      #
      # `--audit-level=high` so a fresh `moderate` in some dev tool does not
      # wall off the repo overnight; anything `high` or `critical` does, which
      # is the level at which the three chains that actually ship in the binary
      # live (mermaid -> dompurify sanitizes user-authored diagrams arriving via
      # import/git sync/P2P; tiptap-markdown -> markdown-it -> linkify-it).
      # `!cancelled()` so one run always reports both ecosystems — a failing
      # `cargo audit` must not hide however many JS advisories landed that week.
      - name: pnpm audit
        if: ${{ !cancelled() }}
        run: pnpm audit --audit-level=high
