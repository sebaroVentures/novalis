name: Bundle smoke

# Weekly canary that `tauri build` still produces installable bundles. CI never
# bundles (it only compiles + tests), and releases are cut rarely — so bundling
# breakage would otherwise go unnoticed until a release. Deliberately NOT run
# per-PR: a full bundle is far slower than the CI build job.
#
# Linux-only for now: one OS is enough to catch the common breakages
# (tauri.conf.json, icons, frontendDist wiring, bundler regressions).

on:
  schedule:
    - cron: "17 5 * * 1" # Mondays 05:17 UTC
  workflow_dispatch:

# Read-only: this job builds bundles, it never publishes them.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  bundle:
    name: tauri build (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      # Keep the token out of .git/config while build.rs / postinstall scripts run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # WebKitGTK stack required for Tauri's Linux build (matches release.yml);
      # libasound2-dev provides the ALSA headers cpal (native voice capture) links against.
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libasound2-dev \
            patchelf \
            build-essential

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: pnpm

      # SHA is master's head, not a tag; see the note in ci.yml for why, and
      # how to re-resolve it.
      - name: Setup Rust (pinned by rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master @ 2026-08-05
        with:
          toolchain: "1.93.0"

      - name: Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "."

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # `tauri build` runs the frontend build first (beforeBuildCommand),
      # compiles the release binary, and produces .deb/.AppImage bundles.
      - name: Build bundles
        run: pnpm --filter @novalis/desktop build

      # Belt and braces: fail if the bundler exited 0 without artifacts.
      - name: Verify bundle artifacts exist
        run: |
          ls -R target/release/bundle
          found="$(find target/release/bundle -name '*.deb' -o -name '*.AppImage' | wc -l)"
          if [ "$found" -eq 0 ]; then
            echo "::error::tauri build produced no .deb/.AppImage artifacts"
            exit 1
          fi
