[package]
name = "novalis-core"
description = "UI-agnostic core logic for Novalis (vault, index, notes, tasks, calendar)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
thiserror.workspace = true
specta.workspace = true
rusqlite = { version = "0.32", features = ["bundled"] }
gray_matter = "0.2"
serde_yaml = "0.9"
walkdir = "2"
regex = "1"
log = "0.4"
sha2 = "0.10"
pulldown-cmark = "0.12"
docx-rs = "0.4"
icalendar = "0.17"
rrule = "0.14"
similar = "2"
# Third-party importers (`import::`). `zip` unpacks a Notion "Export" archive;
# `quick-xml` parses the Evernote ENEX envelope AND its ENML/XHTML note bodies
# (one XML parser for both, so no html5ever/scraper enters the core tree — the
# ENML→Markdown converter is in-house in `import::enex`).
# Both versions match what `docx-rs` already pulls in, so neither adds a new
# transitive crate.
#
# quick-xml stays on 0.36 deliberately. This is the one parser that sees
# UNTRUSTED input (a user-supplied .enex), so RUSTSEC-2026-0194 matters here —
# but it is neutralized at the single call site by `.with_checks(false)`
# (`import::enex::attr_value`), which the advisory names as complete mitigation
# for consumers that do not use `NsReader`. Upgrading to 0.41 would NOT clear
# the audit gate anyway: docx-rs 0.4.20 pins 0.36.2, so that version stays in
# `Cargo.lock` regardless. It would also be a breaking parser migration — 0.41
# emits entity references as separate `Event::GeneralRef`s instead of resolving
# them inline, so a naive bump silently drops every `&amp;` from an imported
# note. See `.cargo/audit.toml` for the audit-gate justifications.
zip = { version = "8.6", default-features = false, features = ["deflate"] }
quick-xml = "0.36"
uuid = { workspace = true }
git2 = { workspace = true }
# P2P sync (W4.4): pure crypto/framing/pairing logic. `chacha20poly1305`
# (XChaCha20-Poly1305 AEAD) seals file contents E2E; `postcard` frames the
# wire protocol; `base64` encodes the pairing ticket. All pure-Rust — no
# openssl — so they add nothing to the openssl isolation surface. The async
# `iroh` QUIC transport lives in the desktop shell, not here.
chacha20poly1305 = "0.10"
rand = "0.8"
base64 = "0.22"
postcard = { version = "1", features = ["use-std"] }
# Pure-Rust HNSW: the native ANN backing chunk-level semantic retrieval. Chosen
# over the sqlite-vec vec0 extension so the multi-model/variable-dim vectors that
# already coexist in one table stay supported, queries run off the engine
# write-lock, and no process-global C extension has to be loaded — see
# `index::vectors::VectorIndex`.
hnsw_rs = "0.3"

[dev-dependencies]
tempfile = "3"
